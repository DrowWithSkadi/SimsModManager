name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Тесты
        run: dotnet test tests/SimsModManager.Tests/SimsModManager.Tests.csproj -c Release --logger "console;verbosity=normal"

      - name: Сборка exe
        run: dotnet publish src/SimsModManager.App/SimsModManager.App.csproj -c Release -o publish

      - uses: actions/upload-artifact@v4
        with:
          name: SimsModManager
          path: publish/SimsModManager.exe

      # Каждый коммит в main обновляет «тестовую сборку» на странице Releases
      - name: Тестовая сборка в Releases
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete dev --cleanup-tag --yes || true
          gh release create dev publish/SimsModManager.exe \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Тестовая сборка" \
            --notes "Автоматическая сборка последнего коммита ($(git log -1 --format=%h): $(git log -1 --format=%s))."

      # Тег вида v1.0.0 — настоящий релиз
      - name: Релиз
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" publish/SimsModManager.exe --title "$GITHUB_REF_NAME" --generate-notes
