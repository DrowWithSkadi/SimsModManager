name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      # Номер версии растёт с каждой сборкой — по нему установленная программа понимает, что есть обновление
      APP_VERSION: 0.3.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      # Мод-помощник: игра работает на Python 3.7, поэтому компилируем именно им
      - uses: actions/setup-python@v5
        with:
          python-version: '3.7'

      - name: Мод-помощник
        run: python helper/build.py src/SimsModManager.App/Assets/Helper

      - name: Тесты
        run: dotnet test tests/SimsModManager.Tests/SimsModManager.Tests.csproj -c Release --logger "console;verbosity=normal"

      - name: Сборка программы
        run: >
          dotnet publish src/SimsModManager.App/SimsModManager.App.csproj -c Release -o publish
          -p:PublishSingleFile=false -p:Version=$APP_VERSION

      - name: Установщик (Velopack)
        run: |
          # Версия инструмента — та же, что у библиотеки Velopack в программе
          VPK=$(grep -o '"Velopack/[0-9.]*"' src/SimsModManager.App/obj/project.assets.json | head -1 | cut -d/ -f2 | tr -d '"')
          echo "Velopack $VPK"
          dotnet tool install -g vpk --version "$VPK"
          vpk pack \
            --packId SimsModManager \
            --packVersion "$APP_VERSION" \
            --packDir publish \
            --mainExe SimsModManager.exe \
            --packTitle "Sims Mod Manager" \
            --packAuthors "DrowWithSkadi" \
            --icon src/SimsModManager.App/Assets/app.ico \
            --outputDir releases
          ls -la releases

      - uses: actions/upload-artifact@v5
        with:
          name: SimsModManager
          path: releases/*

      # Каждый коммит в main обновляет «тестовую сборку» на странице Releases
      - name: Тестовая сборка в Releases
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete dev --cleanup-tag --yes || true
          gh release create dev releases/* \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Тестовая сборка $APP_VERSION" \
            --notes "Скачайте **SimsModManager-win-Setup.exe** и запустите — программа установится, появится в «Пуске» и на рабочем столе и сама будет предлагать обновления (Настройки → Проверить обновления). Без установки: **SimsModManager-win-Portable.zip**.

          Сборка коммита $(git log -1 --format=%h): $(git log -1 --format=%s)"

      # Тег вида v1.0.0 — настоящий релиз
      - name: Релиз
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" releases/* --title "$GITHUB_REF_NAME" --generate-notes
